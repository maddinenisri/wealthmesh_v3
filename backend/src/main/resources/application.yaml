spring:
  web:
    error:
      include-message: always
  application:
    name: wealth-mesh
  main:
    web-application-type: reactive
  r2dbc:
    url: r2dbc:postgresql://localhost:5434/wealthmesh_v3
    username: ${DB_USERNAME:wealthmesh}
    password: ${DB_PASSWORD}
    properties:
      options: search_path=wealthmesh
    pool:
      initial-size: 5
      max-size: 20
  # Boot skips the JDBC DataSource when R2DBC is present, so Flyway needs its own JDBC connection
  flyway:
    url: jdbc:postgresql://localhost:5434/wealthmesh_v3
    user: ${DB_USERNAME:wealthmesh}
    password: ${DB_PASSWORD}
    schemas: wealthmesh
    create-schemas: true

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info

plugins {
    id 'java'
    id 'checkstyle'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.mdstech'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-data-r2dbc'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.flywaydb:flyway-database-postgresql'
    implementation 'org.mapstruct:mapstruct:1.6.3'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'
    runtimeOnly 'org.postgresql:postgresql'
    runtimeOnly 'org.postgresql:r2dbc-postgresql'
    testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-r2dbc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-flyway-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webflux-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    testImplementation 'org.testcontainers:testcontainers-r2dbc'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

checkstyle {
    toolVersion = '12.3.1'
    maxWarnings = 0
}

// Bundle the React app into the fat jar so `java -jar` serves UI and API from one port.
// Pass -PskipFrontend for a backend-only jar (CI, quick iterations).
def frontendDir = layout.projectDirectory.dir('../frontend')

tasks.register('frontendInstall', Exec) {
    description = 'Installs frontend dependencies when node_modules is missing.'
    workingDir = frontendDir
    commandLine 'npm', 'install'
    onlyIf { !frontendDir.dir('node_modules').asFile.exists() }
}

tasks.register('frontendBuild', Exec) {
    description = 'Builds the React app into frontend/dist.'
    dependsOn 'frontendInstall'
    workingDir = frontendDir
    commandLine 'npm', 'run', 'build'
    inputs.dir(frontendDir.dir('src'))
    inputs.files(frontendDir.file('index.html'), frontendDir.file('package.json'),
            frontendDir.file('package-lock.json'), frontendDir.file('vite.config.ts'))
    inputs.files(fileTree(frontendDir) { include 'tsconfig*.json' })
    outputs.dir(frontendDir.dir('dist'))
}

tasks.named('bootJar') {
    if (!project.hasProperty('skipFrontend')) {
        dependsOn 'frontendBuild'
        from(frontendDir.dir('dist')) {
            into 'BOOT-INF/classes/static'
        }
    }
}
